<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026節水知識大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        .screen { display: none; }
        .active-screen { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-400 to-blue-600 min-h-screen flex items-center justify-center p-4">

    <!-- 1. 開始畫面 -->
    <div id="screen-start" class="screen active-screen bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
        <!-- 已更換為您提供的 Banner 圖片 -->
        <img src="https://i.postimg.cc/Hkz7Rj81/banner-01(1).jpg" class="w-full h-40 object-cover">
        <div class="p-8 text-center">
            <h1 class="text-2xl font-bold text-blue-600 mb-4">💧 節水知識大挑戰 💧</h1>
            <p class="text-gray-600 mb-8">連續答對 5 題，獲得大獎抽獎資格！</p>
            <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform">開始挑戰 🚀</button>
        </div>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="screen-game" class="screen bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 relative">
        <div class="flex justify-between items-center mb-4 text-sm font-bold text-gray-400">
            <span id="score-display">連對: 0</span>
            <span id="question-count">1/5</span>
        </div>
        <div class="w-full bg-gray-100 h-2.5 rounded-full mb-6 overflow-hidden">
            <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 w-0 transition-all duration-500"></div>
        </div>
        <div id="question-text" class="text-lg font-bold text-gray-700 mb-8 leading-relaxed"></div>
        <div id="options-container" class="space-y-3"></div>

        <!-- 答對時彈出的教育備註小卡 -->
        <div id="remark-modal" class="hidden absolute inset-0 bg-white/95 z-10 flex flex-col items-center justify-center p-8 modal-enter">
            <div class="text-4xl mb-4">💡</div>
            <h3 class="text-xl font-bold text-blue-500 mb-4">節水小常識</h3>
            <p id="remark-text" class="text-gray-600 leading-relaxed mb-8 text-center"></p>
            <button onclick="nextQuestion()" class="w-full py-3 bg-blue-500 text-white font-bold rounded-xl shadow-md active:scale-95">下一題 ➔</button>
        </div>
    </div>

    <!-- 3. 遊戲失敗畫面 -->
    <div id="screen-fail" class="screen bg-white w-full max-w-md rounded-3xl shadow-2xl p-10 text-center">
        <div class="text-6xl mb-4">💦</div>
        <h2 class="text-2xl font-bold text-red-500 mb-4">哎呀，答錯了！</h2>
        <p class="text-gray-600 mb-8">別灰心，我們再試一次！</p>
        <button onclick="retryQuestion()" class="w-full py-4 bg-blue-500 text-white font-bold rounded-xl">再試一次 🔄</button>
    </div>

    <!-- 4. 同意書畫面 -->
    <div id="screen-consent" class="screen bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden p-8">
        <h2 class="text-2xl font-bold text-blue-600 mb-4 text-center">🏆 挑戰成功！</h2>
        <p class="text-gray-600 mb-6 text-center">恭喜通過考驗！請填寫資料領取獎勵。</p>
        <button onclick="showScreen('screen-form')" class="w-full py-4 bg-blue-500 text-white font-bold rounded-xl">同意並填寫資料</button>
    </div>
    
    <!-- 5. 填寫領獎資料畫面 -->
    <div id="screen-form" class="screen bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
        <h2 class="text-xl font-bold text-gray-700 mb-6">🎁 填寫領獎資料</h2>
        <input type="text" id="name" class="w-full p-3 border-2 mb-4 rounded-xl" placeholder="姓名">
        <input type="tel" id="phone" maxlength="10" class="w-full p-3 border-2 mb-4 rounded-xl" placeholder="09xxxxxxxx">
        <input type="email" id="email" class="w-full p-3 border-2 mb-6 rounded-xl" placeholder="Email">
        <!-- 修正後的送出按鈕 -->
        <button id="submit-btn" onclick="submitData()" class="w-full py-4 bg-blue-500 text-white font-bold rounded-xl">確認送出</button>
    </div>

    <!-- 6. 成功畫面 -->
    <div id="screen-success" class="screen bg-white w-full max-w-md rounded-3xl shadow-2xl p-12 text-center">
        <div class="text-7xl mb-6">🎉</div>
        <h2 class="text-2xl font-bold text-green-500 mb-4">送出成功！</h2>
        <button onclick="liff.closeWindow()" class="w-full py-4 bg-green-500 text-white font-bold rounded-xl">關閉視窗</button>
    </div>

    <script>
        // 題庫資料 (已加入 Excel 備註)
        const ALL_QUESTIONS = [
            {q: "當把家中所有用水設備都關閉後，發現水表指針還在轉動，這代表什麼意思呢？", options: ["水表太髒了", "水表在發電", "家裡的用水設備正在漏水"], ans: "家裡的用水設備正在漏水", note: "當把家中所有用水設備都關閉後，發現水表指針還在轉動就可能是有漏水情形喔！"},
            {q: "家裡的水龍頭或蓮蓬頭，要怎麼知道它是不是真的能「節省用水」？", options: ["看價格", "看顏色", "找找看有沒有「省水標章」"], ans: "找找看有沒有「省水標章」", note: "貼有這個標章的產品，是用科學方法測試過，確認比一般器材更節省用水！"},
            {q: "如果你家裡有兩個水龍頭，一個是舊的，一個是貼有省水標章的，你會推薦優先使用哪個水龍頭？", options: ["舊的水龍頭", "貼有省水標章的水龍頭", "兩個輪流用"], ans: "貼有省水標章的水龍頭", note: "省水標章的水龍頭流速和出水設計更有效率，能默默節省更多水！"},
            {q: "想要知道家裡的水龍頭或馬桶有沒有比較省水，要找找看上面有沒有貼什麼標誌？", options: ["環保標章", "省水標章", "國家品質標章"], ans: "省水標章", note: "貼有省水標章的產品，用水量比一般產品少很多！"},
            {q: "為什麼管理水的壓力很重要？", options: ["讓水管變堅堅", "確保水能穩定流到每戶人家", "讓水流有聲音"], ans: "確保水能穩定流到每戶人家", note: "穩定水壓能保護水管不爆裂，避免水資源流失。"},
            {q: "如果你在路上看到地面有水噴出來，周圍沒有下雨，很有可能是什麼原因？", options: ["有人惡作劇", "地下水管發生破裂", "路面在流汗"], ans: "地下水管發生破裂", note: "如果水勢很大，很可能就是自來水管線破裂，要趕快通知北水處搶修！"},
            {q: "刷牙時，最好的節水習慣是？", options: ["讓水龍頭一直開著", "用杯子接水漱口", "邊唱歌邊刷牙"], ans: "用杯子接水漱口", note: "刷牙時開著水龍頭3分鐘，會浪費約6公升的水！"},
            {q: "下列哪種方式，可以將「一水多用」的精神發揮到極致？", options: ["洗澡時間拉長", "洗米水拿去澆花、洗澡水沖馬桶", "買很多水來備用"], ans: "洗米水拿去澆花、洗澡水沖馬桶", note: "洗米水澆花或洗澡水沖馬桶是環保又節水的聰明方法！"},
            {q: "如果發現馬桶沖水後還一直有水流聲，代表最可能發生了什麼問題？", options: ["馬桶在唱歌", "馬桶水箱零件可能漏水", "馬桶沒吃飽"], ans: "馬桶水箱零件可能漏水", note: "水箱零件漏水一天可能浪費超過100公升的水！"},
            {q: "哪一個生活情境最能體現「珍惜每一滴水」的觀念？", options: ["每天泡澡", "洗澡用淋浴，並在塗肥皂時暫時關水", "讓水龍頭一直滴水"], ans: "洗澡用淋浴，並在塗肥皂時暫時關水", note: "淋浴比泡澡節省許多水，暫時關水能避免白白流失。"}
        ];

        let gameQuestions = [], currentQIndex = 0, isAnswering = false;

        // 💡 請確保填寫正確的 LIFF ID
        liff.init({ liffId: '2009856120-Dh5xqPAk' }).then(() => { if (!liff.isLoggedIn()) liff.login(); });

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        }

        function startGame() {
            gameQuestions = [...ALL_QUESTIONS].sort(() => 0.5 - Math.random()).slice(0, 5);
            currentQIndex = 0;
            renderQuestion();
            showScreen('screen-game');
        }

        function renderQuestion() {
            isAnswering = false;
            document.getElementById('remark-modal').classList.add('hidden');
            const qData = gameQuestions[currentQIndex];
            document.getElementById('question-count').innerText = `${currentQIndex + 1}/5`;
            document.getElementById('score-display').innerText = `連對: ${currentQIndex}`;
            document.getElementById('progress-fill').style.width = `${(currentQIndex / 5) * 100}%`;
            document.getElementById('question-text').innerText = qData.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-4 bg-gray-50 border-2 rounded-xl font-bold text-gray-600 text-left';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, qData.ans);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            if (isAnswering) return;
            isAnswering = true;
            if (selected === correct) {
                btn.classList.add('bg-green-100', 'border-green-400');
                setTimeout(() => {
                    document.getElementById('remark-text').innerText = gameQuestions[currentQIndex].note;
                    document.getElementById('remark-modal').classList.remove('hidden');
                }, 400);
            } else {
                btn.classList.add('bg-red-100', 'border-red-400');
                setTimeout(() => showScreen('screen-fail'), 600);
            }
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < 5) renderQuestion();
            else showScreen('screen-consent');
        }

        function retryQuestion() {
            isAnswering = false;
            showScreen('screen-game');
        }

        // 💡 關鍵修復：優化後的資料送出函數
        async function submitData() {
            const n = document.getElementById('name').value;
            const p = document.getElementById('phone').value;
            const e = document.getElementById('email').value;
            
            if (!/^09\d{8}$/.test(p)) return alert('請輸入正確的手機號碼 (10碼)');
            if (!n || !e) return alert('欄位不可留白');

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "資料送出中...";

            try {
                const profile = await liff.getProfile();
                // 💡 注意：這裡使用絕對路徑指向您的 Render 後端
                const response = await fetch('https://two026watergame.onrender.com/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: profile.userId, name: n, phone: p, email: e })
                });
                
                const result = await response.json();
                if (result.success) {
                    showScreen('screen-success');
                } else {
                    alert("送出失敗: " + result.error);
                    btn.disabled = false;
                    btn.innerText = "確認送出";
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("網路異常或後端未啟動，請檢查 Render 狀態。");
                btn.disabled = false;
                btn.innerText = "確認送出";
            }
        }
    </script>
</body>
</html>
