<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30秒節水記憶挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        /* 翻牌的 3D 透視與過渡動畫設定 */
        .perspective { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .transition-transform { transition: transform 0.5s ease-in-out; }
        
        /* 防止使用者選取文字影響遊戲體驗 */
        body { user-select: none; -webkit-user-select: none; }
        
        /* 隱藏捲軸保持版面乾淨 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 to-blue-200 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl overflow-hidden relative border-2 border-cyan-100">
        
        <div class="bg-gradient-to-r from-cyan-500 to-blue-500 text-white p-4 text-center relative">
            
            <div id="profile-container" class="absolute top-3 right-3 flex items-center gap-2 hidden bg-white/20 px-2 py-1 rounded-full backdrop-blur-sm">
                <span id="user-name" class="text-xs font-bold drop-shadow-md">載入中</span>
                <img id="user-avatar" class="w-6 h-6 rounded-full border border-white object-cover" src="https://via.placeholder.com/150" alt="avatar" />
            </div>

            <h1 class="text-2xl font-bold mb-2 mt-4 flex items-center justify-center gap-2">
                <span>💧</span> 節水記憶挑戰 <span>💧</span>
            </h1>
            <div class="flex justify-between items-center px-4 font-mono text-lg">
                <div><span id="status-text">剩餘時間</span>: <span id="time-display" class="font-bold text-yellow-300">30</span> <span id="time-unit">秒</span></div>
                <div>配對: <span id="score-display">0</span>/<span id="total-pairs">6</span></div>
            </div>
        </div>

        <div id="game-board" class="grid grid-cols-3 md:grid-cols-4 gap-2 p-4 bg-cyan-900/5 min-h-[350px]">
            </div>

        <div id="overlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-10">
            <div id="message-box" class="bg-white p-6 rounded-xl text-center max-w-[80%]">
                <h2 id="overlay-title" class="text-xl font-bold text-cyan-800 mb-2">準備好了嗎？</h2>
                <p id="overlay-desc" class="text-cyan-700 mb-6 text-sm">請在 30 秒內找出所有節水小撇步！</p>
                <button id="start-btn" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95">
                    載入中...
                </button>
            </div>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-gray-500 font-bold mb-2">連接 LINE 帳號中...</p>
    </div>

    <script>
        // --- 變數設定 ---
        const LIFF_ID = "2009756203-gC2ejwHA"; 
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyKj4yt8ERMzAsQATvSmQtYruS9v4RzBa8xTA5lqiu_KknEUAcc8Zhe41dK_tMJJecfjw/exec"; 

        const GAME_TIME = 30;
        const MEMO_TIME = 10; 
        const TOTAL_PAIRS = 6; 
        
        // 節水題目
        const waterTips = [
            { id: 1, icon: '🚰', text: '洗手水再利用' },
            { id: 2, icon: '🚿', text: '淋浴代替泡澡' },
            { id: 3, icon: '🪣', text: '冷水回收利用' },
            { id: 4, icon: '🚽', text: '兩段式沖水' },
            { id: 5, icon: '🌱', text: '洗米水再利用' },
            { id: 6, icon: '👕', text: '衣服集中清洗' },
            { id: 7, icon: '🛠️', text: '安裝節水裝置' },
            { id: 8, icon: '🔍', text: '馬桶定期查漏' }
        ];
        
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let timer = null;
        let timeLeft = GAME_TIME;
        let isPlaying = false;
        let isLockBoard = false;
        let userProfile = null; 

        // --- DOM 元素 ---
        const board = document.getElementById('game-board');
        const statusText = document.getElementById('status-text');
        const timeDisplay = document.getElementById('time-display');
        const scoreDisplay = document.getElementById('score-display');
        const totalPairsDisplay = document.getElementById('total-pairs');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');
        const loading = document.getElementById('loading');
        const profileContainer = document.getElementById('profile-container');
        const userNameElem = document.getElementById('user-name');
        const userAvatarElem = document.getElementById('user-avatar');

        // --- API 互動 (僅記錄，不阻擋) ---
        async function recordPlayToday(lineUserId, profileName) {
            try {
                const encodedName = encodeURIComponent(profileName);
                fetch(`${GAS_API_URL}?action=record&userId=${lineUserId}&displayName=${encodedName}`).catch(e => console.error(e));
            } catch (e) {
                console.error("記錄遊玩次數失敗", e);
            }
        }

        // --- 初始化流程 ---
        async function initializeAppFlow() {
            try {
                if (!window.navigator.userAgent.includes('Line')) {
                    loading.style.display = 'none';
                    overlayTitle.textContent = `嗨，訪客！`;
                    overlayDesc.textContent = '此為網頁預覽模式，不限次數暢玩！';
                    startBtn.textContent = '開始遊戲';
                    startBtn.onclick = startGame;
                    return;
                }

                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                userProfile = await liff.getProfile();
                profileContainer.classList.remove('hidden');
                userNameElem.textContent = userProfile.displayName;
                userAvatarElem.src = userProfile.pictureUrl || 'https://via.placeholder.com/150';

                loading.style.display = 'none';
                overlayTitle.textContent = `嗨，${userProfile.displayName}！`;
                overlayDesc.textContent = '準備好接受挑戰了嗎？找出所有節水小撇步！';
                startBtn.textContent = '開始遊戲';
                startBtn.onclick = startGame;
                
            } catch (err) {
                console.error("初始化失敗", err);
                loading.style.display = 'none';
                overlayTitle.textContent = `系統預覽模式`;
                overlayDesc.textContent = `無法連線至 LINE，目前以純網頁模式執行。`;
                startBtn.textContent = '開始遊戲';
                startBtn.onclick = startGame;
            }
        }

        // --- 遊戲核心邏輯 ---
        function createBoard() {
            board.innerHTML = '';
            const selectedTips = [...waterTips].sort(() => Math.random() - 0.5).slice(0, TOTAL_PAIRS);
            cards = [...selectedTips, ...selectedTips].sort(() => Math.random() - 0.5);
            
            cards.forEach((tip, index) => {
                const card = document.createElement('div');
                card.className = 'relative w-full aspect-square perspective cursor-pointer';
                card.dataset.id = tip.id;
                
                const inner = document.createElement('div');
                inner.className = 'w-full h-full absolute transform-style-3d transition-transform duration-500 card-inner shadow-sm rounded-lg';
                
                const back = document.createElement('div');
                back.className = 'w-full h-full absolute backface-hidden bg-gradient-to-br from-cyan-400 to-blue-500 rounded-lg flex items-center justify-center border-2 border-white/50 shadow-md';
                back.innerHTML = '<span class="text-white text-3xl opacity-70 drop-shadow-md">💧</span>';

                const front = document.createElement('div');
                front.className = 'w-full h-full absolute backface-hidden rotate-y-180 bg-white rounded-lg flex flex-col items-center justify-center shadow-inner border-2 border-cyan-200';
                front.innerHTML = `
                    <span class="text-2xl md:text-3xl mb-1">${tip.icon}</span>
                    <span class="text-[10px] md:text-xs font-bold text-cyan-800 text-center leading-tight px-1">${tip.text}</span>
                `;

                inner.appendChild(back);
                inner.appendChild(front);
                card.appendChild(inner);

                card.addEventListener('click', () => flipCard(card, inner));
                board.appendChild(card);
            });
        }

        function flipCard(card, inner) {
            if (!isPlaying || isLockBoard) return;
            if (flippedCards.includes(card) || card.classList.contains('matched')) return;

            inner.classList.add('rotate-y-180');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            const [card1, card2] = flippedCards;
            const match = card1.dataset.id === card2.dataset.id;

            if (match) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                scoreDisplay.textContent = matchedPairs;
                resetFlipped();
                
                if (matchedPairs === TOTAL_PAIRS) {
                    endGame(true);
                }
            } else {
                setTimeout(() => {
                    card1.querySelector('.card-inner').classList.remove('rotate-y-180');
                    card2.querySelector('.card-inner').classList.remove('rotate-y-180');
                    resetFlipped();
                }, 800);
            }
        }

        function resetFlipped() {
            flippedCards = [];
            isLockBoard = false;
        }

        // --- 遊戲流程控制 ---
        function startGame() {
            if(userProfile) {
                recordPlayToday(userProfile.userId, userProfile.displayName);
            }

            matchedPairs = 0;
            scoreDisplay.textContent = matchedPairs;
            totalPairsDisplay.textContent = TOTAL_PAIRS;
            overlay.style.display = 'none';
            isPlaying = false; 
            isLockBoard = true; 
            flippedCards = [];
            
            createBoard();

            let memoTime = MEMO_TIME;
            statusText.textContent = '記憶時間';
            timeDisplay.textContent = memoTime;
            timeDisplay.className = 'font-bold text-cyan-300';

            const allInners = document.querySelectorAll('.card-inner');
            setTimeout(() => {
                allInners.forEach(inner => inner.classList.add('rotate-y-180'));
            }, 100);

            clearInterval(timer);
            timer = setInterval(() => {
                memoTime--;
                timeDisplay.textContent = memoTime;
                
                if (memoTime <= 0) {
                    clearInterval(timer);
                    allInners.forEach(inner => inner.classList.remove('rotate-y-180'));
                    setTimeout(startActualGame, 500);
                }
            }, 1000);
        }

        function startActualGame() {
            isPlaying = true;
            isLockBoard = false;
            timeLeft = GAME_TIME;
            
            statusText.textContent = '剩餘時間';
            timeDisplay.textContent = timeLeft;
            timeDisplay.className = 'font-bold text-yellow-300';

            timer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    timeDisplay.classList.add('text-red-500', 'animate-pulse');
                } else {
                    timeDisplay.classList.remove('text-red-500', 'animate-pulse');
                }

                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function endGame(isWin) {
            clearInterval(timer);
            isPlaying = false;
            overlay.style.display = 'flex';
            
            statusText.textContent = '剩餘時間';
            timeDisplay.className = 'font-bold text-yellow-300';
            
            if (isWin) {
                const usedTime = GAME_TIME - timeLeft;
                overlayTitle.textContent = '🎉 挑戰成功！';
                overlayTitle.className = 'text-xl font-bold text-green-600 mb-2';
                overlayDesc.textContent = `太厲害了，你只花了 ${usedTime} 秒！`;
                startBtn.textContent = '傳送成績並去抽獎';
                startBtn.onclick = () => sendResultToChat(true, usedTime);
            } else {
                overlayTitle.textContent = '😢 時間到！';
                overlayTitle.className = 'text-xl font-bold text-red-600 mb-2';
                overlayDesc.textContent = `還差一點點！多試幾次一定能過關！`;
                startBtn.textContent = '重新挑戰';
                startBtn.onclick = startGame; 
            }
        }

        function sendResultToChat(isWin, time) {
            if (typeof liff === 'undefined' || !liff.isInClient()) {
                showMessage("此為預覽模式，不會實際傳送訊息到 LINE。");
                setTimeout(startGame, 3000);
                return;
            }

            // 更新過關和失敗的文案
            const messageText = isWin 
                ? `🎉 恭喜您花了 ${time} 秒過關！請點擊下方網址前往參加抽獎轉盤獲得好禮🎉\n➡️ https://liff.line.me/2010042972-TAJHISto`
                : `😢 抱歉，今天的「節水記憶挑戰」失敗了！`;

            startBtn.textContent = '傳送中...';
            startBtn.disabled = true;

            liff.sendMessages([{
                type: 'text',
                text: messageText
            }]).then(() => {
                liff.closeWindow(); 
            }).catch((err) => {
                console.error('傳送訊息失敗', err);
                startBtn.textContent = '關閉視窗';
                startBtn.disabled = false;
                startBtn.onclick = () => liff.closeWindow();
            });
        }

        function showMessage(msg) {
            const tempDiv = document.createElement('div');
            tempDiv.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded shadow-lg z-50 text-sm w-11/12 text-center break-words';
            tempDiv.textContent = msg;
            document.body.appendChild(tempDiv);
            setTimeout(() => tempDiv.remove(), 4000);
        }

        window.onload = initializeAppFlow;

    </script>
</body>
</html>
